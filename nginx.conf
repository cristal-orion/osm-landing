server {
    listen 4321;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # URL puliti per le pagine statiche Astro
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Cache lunga per gli asset statici
    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }
}
